services:
  - type: web
    name: awareness-competition
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: CODE_HASH_SECRET
        sync: false
      - key: PARTICIPANT_CODES
        sync: false
      - key: DB_NAME
        value: awareness_competition
