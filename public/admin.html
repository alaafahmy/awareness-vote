<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>لوحة إدارة التوعية | حصانة</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
  <header class="admin-header">
    <div class="shell">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">◆</span><span>حصانة<small style="color:#bdd0cf">لوحة إدارة التجربة</small></span></a>
      <a class="button small" href="index.html" target="_blank" rel="noopener">فتح صفحة المشاركة</a>
    </div>
  </header>

  <main class="admin-main shell">
    <section class="auth-panel" aria-labelledby="authTitle">
      <h1 id="authTitle" style="margin:0 0 6px">الوصول المحمي</h1>
      <p>أدخل قيمة <code>ADMIN_KEY</code>. تُحفظ في هذه النافذة فقط ولا تُضاف إلى الرابط.</p>
      <div class="auth-row">
        <input id="adminKey" type="password" autocomplete="current-password" placeholder="مفتاح الإدارة" aria-label="مفتاح الإدارة">
        <button class="button small" id="connectButton" type="button">فتح اللوحة</button>
        <button class="button secondary small" id="forgetButton" type="button">نسيان المفتاح</button>
      </div>
      <div class="admin-message" id="adminMessage" role="alert" aria-live="polite"></div>
    </section>

    <section aria-labelledby="dashboardTitle">
      <div class="admin-toolbar">
        <div>
          <span class="eyebrow">بيانات دائمة ومقنّعة</span>
          <h2 id="dashboardTitle">سجل المشاركات</h2>
        </div>
        <div class="card-actions">
          <button class="button small" id="triggerAllButton" type="button" disabled>إطلاق التوعية للمنتظرين</button>
          <button class="button secondary small" id="refreshButton" type="button">تحديث</button>
        </div>
      </div>

      <div class="kpi-grid">
        <div class="kpi-card"><span>إجمالي المشاركات</span><strong id="totalCount">—</strong></div>
        <div class="kpi-card"><span>بانتظار النتيجة</span><strong id="waitingCount">—</strong></div>
        <div class="kpi-card"><span>ظهرت لهم التوعية</span><strong id="triggeredCount">—</strong></div>
      </div>

      <div class="entry-list" id="entryList">
        <div class="empty-state">أدخل مفتاح الإدارة لعرض السجلات.</div>
      </div>
    </section>
  </main>

  <script>
    const keyInput = document.getElementById('adminKey');
    const message = document.getElementById('adminMessage');
    const entryList = document.getElementById('entryList');
    const triggerAllButton = document.getElementById('triggerAllButton');
    let pollTimer;

    const answerLabels = {
      'verify-link': 'تحقّق من الرابط والمرسل',
      'share-code': 'مشاركة رمز التحقق',
      'strong-password': 'إدخال كلمة المرور',
    };

    function getKey() {
      return sessionStorage.getItem('awareness-admin-key') || '';
    }

    function escapeHtml(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: { ...(options.headers || {}), 'x-admin-key': getKey() },
        cache: 'no-store',
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'تعذر تنفيذ الطلب.');
      return data;
    }

    function render(records) {
      if (!records.length) {
        entryList.innerHTML = '<div class="empty-state">لا توجد مشاركات بعد. افتح صفحة المشاركة لإجراء تجربة آمنة.</div>';
        return;
      }

      entryList.innerHTML = records.map((record) => {
        const waiting = record.status === 'waiting';
        const date = new Date(record.createdAt).toLocaleString('ar-SA');
        return `
          <article class="entry-card">
            <div>
              <div class="badge ${waiting ? '' : 'done'}">${waiting ? 'بانتظار التوعية' : 'تمت التوعية'}</div>
              <h3>${escapeHtml(record.displayName)}</h3>
              <div class="meta">
                <span>البريد المقنّع: <b dir="ltr">${escapeHtml(record.maskedEmail)}</b></span>
                <span>الإجابة: ${escapeHtml(answerLabels[record.answer] || 'غير معروفة')}</span>
                <span>${escapeHtml(date)}</span>
              </div>
            </div>
            <div class="card-actions">
              ${waiting ? `<button class="button small" type="button" data-action="trigger" data-id="${escapeHtml(record.id)}">إظهار التوعية</button>` : ''}
              <button class="button secondary small" type="button" data-action="delete" data-id="${escapeHtml(record.id)}">حذف</button>
            </div>
          </article>`;
      }).join('');
    }

    async function loadRecords(showSuccess = false) {
      if (!getKey()) return;
      try {
        const data = await api('/api/admin/records');
        document.getElementById('totalCount').textContent = data.total;
        document.getElementById('waitingCount').textContent = data.waitingCount;
        document.getElementById('triggeredCount').textContent = data.triggeredCount;
        triggerAllButton.disabled = data.waitingCount === 0;
        render(data.records);
        message.style.color = 'var(--success)';
        message.textContent = showSuccess ? 'تم تحديث السجلات.' : '';
        window.clearInterval(pollTimer);
        pollTimer = window.setInterval(() => loadRecords(false), 5000);
      } catch (error) {
        message.style.color = 'var(--danger)';
        message.textContent = error.message;
        window.clearInterval(pollTimer);
      }
    }

    document.getElementById('connectButton').addEventListener('click', () => {
      const value = keyInput.value.trim();
      if (!value) {
        message.textContent = 'أدخل مفتاح الإدارة أولًا.';
        return;
      }
      sessionStorage.setItem('awareness-admin-key', value);
      keyInput.value = '';
      loadRecords(true);
    });

    document.getElementById('forgetButton').addEventListener('click', () => {
      sessionStorage.removeItem('awareness-admin-key');
      window.clearInterval(pollTimer);
      message.textContent = 'تم نسيان مفتاح الإدارة.';
      entryList.innerHTML = '<div class="empty-state">أدخل مفتاح الإدارة لعرض السجلات.</div>';
    });

    document.getElementById('refreshButton').addEventListener('click', () => loadRecords(true));

    triggerAllButton.addEventListener('click', async () => {
      if (!window.confirm('سيتم إظهار شاشة التوعية لجميع المشاركين المنتظرين. هل تريد المتابعة؟')) return;
      try {
        const data = await api('/api/admin/trigger-all', { method: 'POST' });
        message.style.color = 'var(--success)';
        message.textContent = `تم إطلاق التوعية لـ ${data.count} مشارك.`;
        await loadRecords(false);
      } catch (error) {
        message.style.color = 'var(--danger)';
        message.textContent = error.message;
      }
    });

    entryList.addEventListener('click', async (event) => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      const id = button.dataset.id;
      button.disabled = true;

      try {
        if (button.dataset.action === 'trigger') {
          await api(`/api/admin/trigger/${encodeURIComponent(id)}`, { method: 'POST' });
        } else if (button.dataset.action === 'delete') {
          if (!window.confirm('هل تريد حذف هذا السجل نهائيًا؟')) {
            button.disabled = false;
            return;
          }
          await api(`/api/admin/records/${encodeURIComponent(id)}`, { method: 'DELETE' });
        }
        await loadRecords(false);
      } catch (error) {
        message.style.color = 'var(--danger)';
        message.textContent = error.message;
        button.disabled = false;
      }
    });

    if (getKey()) loadRecords(false);
  </script>
</body>
</html>
