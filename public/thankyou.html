<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>تم استلام مشاركتك | حصانة</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="center-page">
    <section class="status-card" aria-labelledby="statusTitle">
      <div class="status-icon" aria-hidden="true">✓</div>
      <span class="eyebrow">تم الاستلام بنجاح</span>
      <h1 id="statusTitle">مشاركتك في قائمة المراجعة</h1>
      <p>احتفظ بهذه الصفحة مفتوحة. عند إطلاق نتيجة التحدي من المشرف ستنتقل تلقائيًا إلى شاشة التوعية.</p>
      <div class="status-box" id="statusBox" role="status" aria-live="polite">
        <span class="pulse"></span>في انتظار النتيجة...
      </div>
      <a class="button secondary" href="awareness.html">استكشف مركز المعرفة الآن</a>
    </section>
  </main>

  <script>
    const id = new URLSearchParams(window.location.search).get('id');
    const statusBox = document.getElementById('statusBox');

    async function checkStatus() {
      if (!id) {
        statusBox.textContent = 'رابط المشاركة غير مكتمل.';
        return;
      }

      try {
        const response = await fetch(`/api/status/${encodeURIComponent(id)}`, { cache: 'no-store' });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'تعذر التحقق من الحالة.');
        if (data.triggered) {
          window.location.replace(`reveal.html?id=${encodeURIComponent(id)}`);
        }
      } catch (error) {
        statusBox.textContent = error.message;
      }
    }

    checkStatus();
    window.setInterval(checkStatus, 4000);
  </script>
</body>
</html>
