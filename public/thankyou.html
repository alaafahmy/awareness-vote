<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>تم استلام مشاركتك | مدار</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="draw-status-page">
  <header class="draw-header">
    <a class="contest-brand" href="index.html">
      <span class="contest-logo" aria-hidden="true"><i></i><i></i></span>
      <span><b>مَدار</b><small>جوائز التقنية</small></span>
    </a>
    <span>بطاقة مشاركة مؤكدة</span>
  </header>

  <main class="draw-status-main">
    <section class="draw-status-card" aria-labelledby="statusTitle">
      <div class="draw-success-mark" aria-hidden="true">✓</div>
      <span class="draw-kicker">تم التسجيل بنجاح</span>
      <h1 id="statusTitle">أنت الآن ضمن قائمة السحب</h1>
      <p>تم اعتماد بطاقة دخولك. احتفظ بهذه الصفحة مفتوحة لمشاهدة الإعلان فور صدوره.</p>

      <div class="draw-ticket">
        <div>
          <span>مرجع المشاركة</span>
          <strong id="ticketReference" dir="ltr">MDAR-••••••••</strong>
        </div>
        <div class="draw-ticket-status" id="statusBox" role="status" aria-live="polite">
          <i></i>
          <span>بانتظار اعتماد النتيجة</span>
        </div>
      </div>

      <div class="draw-progress" aria-hidden="true"><i></i></div>
      <p class="draw-note">سيتم التحقق تلقائيًا دون الحاجة لتحديث الصفحة.</p>
    </section>
  </main>

  <footer class="draw-footer">© 2026 مدار لجوائز التقنية</footer>

  <script>
    const id = new URLSearchParams(window.location.search).get('id');
    const statusBox = document.getElementById('statusBox');
    const reference = document.getElementById('ticketReference');

    if (id) reference.textContent = `MDAR-${id.slice(0, 8).toUpperCase()}`;

    async function checkStatus() {
      if (!id) {
        statusBox.innerHTML = '<span>رابط المشاركة غير مكتمل</span>';
        return;
      }

      try {
        const response = await fetch(`/api/status/${encodeURIComponent(id)}`, { cache: 'no-store' });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'تعذر التحقق من الحالة.');
        if (data.triggered) {
          window.location.replace(`reveal.html?id=${encodeURIComponent(id)}`);
        }
      } catch (error) {
        statusBox.innerHTML = `<span>${escapeHtml(error.message)}</span>`;
      }
    }

    function escapeHtml(value) {
      return String(value || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
    }

    checkStatus();
    window.setInterval(checkStatus, 4000);
  </script>
</body>
</html>
